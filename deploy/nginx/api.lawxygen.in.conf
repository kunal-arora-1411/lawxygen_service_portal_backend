# nginx site for api.lawxygen.in.
#
# Install to /etc/nginx/sites-available/api.lawxygen.in and symlink into sites-enabled.
#
# This is the plain-HTTP form on purpose. `certbot --nginx -d api.lawxygen.in` rewrites
# it in place, adding the TLS server block, the certificate paths and the :80 -> :443
# redirect, and registers the renewal. Writing the TLS block by hand here would mean
# certbot could not manage it and renewal would silently stop working.

server {
    listen 80;
    listen [::]:80;

    server_name api.lawxygen.in;

    # The app caps bodies at 1mb. Two gives webhooks headroom without letting an
    # unauthenticated POST tie up the box.
    client_max_body_size 2m;

    # nginx announcing its version to every 404 helps nobody but a scanner.
    server_tokens off;

    access_log /var/log/nginx/api.lawxygen.in.access.log;
    error_log  /var/log/nginx/api.lawxygen.in.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # `trust proxy` is set to 1 in the app, so it reads the client's real address and
        # scheme from these. Without them every request looks like it came from 127.0.0.1
        # over HTTP, which breaks rate limiting by IP and secure-cookie detection.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Nothing here may alter the request body. Razorpay and Meta both sign the exact
        # bytes they sent, and the app verifies that signature against a raw Buffer — a
        # body that is re-encoded anywhere between them and the handler can never match.
        # nginx passes bodies through untouched; the rule is to keep it that way and not
        # add any request-rewriting module to this location.

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }

    # Liveness, kept out of the access log so a 30-second probe does not bury real
    # traffic. It does not touch the database by design.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
