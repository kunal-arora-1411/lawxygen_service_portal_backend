# Production composition for api.lawxygen.in.
#
# One service. The database is Neon, so nothing stateful runs on this box — which means
# the whole of this host is replaceable and no backup on it matters.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The port binds to 127.0.0.1 deliberately: nginx on the host terminates TLS and proxies
# to it, and the API is never reachable from outside without passing through that. A
# bare `4000:4000` would publish it to the internet and, on this distribution, punch
# through ufw while doing it.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawxygen-api:latest
    container_name: lawxygen-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      # /health deliberately does not touch the database: a brief Neon blip should not
      # make Docker decide the process is dead and restart it into the same blip.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Migrations, as a one-off. Never starts with `up` — it is behind a profile, so
  # `docker compose up -d` cannot accidentally run schema changes as a side effect of
  # a restart. deploy.sh invokes it explicitly, before anything is restarted:
  #
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: lawxygen-api-migrate:latest
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_ENV: production
    profiles: ["tools"]
    restart: "no"
